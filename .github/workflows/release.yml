name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: 🚀 Build Windows Installer & Release
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: ⬇️ Download VC++ Redistributable (bundled for offline install)
        shell: pwsh
        run: |
          Write-Host "Downloading VC++ Redistributable..."
          $url = "https://aka.ms/vs/17/release/vc_redist.x64.exe"
          $output = "resources/vc_redist.x64.exe"
          Invoke-WebRequest -Uri $url -OutFile $output -UseBasicParsing
          $size = [math]::Round((Get-Item $output).Length / 1MB, 1)
          Write-Host "✓ Downloaded vc_redist.x64.exe ($size MB)"
          # Verify it's a valid PE file
          $bytes = [System.IO.File]::ReadAllBytes($output)[0..1]
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            Write-Error "Downloaded file is not a valid EXE!"
            exit 1
          }
          Write-Host "✓ Valid executable verified"

      - name: 🔍 Typecheck
        run: npm run typecheck

      - name: 🏗️ Build renderer + main + preload
        run: npm run build

      - name: 🧪 Smoke test
        run: node scripts/smoke-test.mjs

      - name: 📦 Build Windows installer (NSIS)
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📊 List release artifacts
        shell: pwsh
        run: |
          Write-Host "### 📦 Release Artifacts" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Write-Host "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Get-ChildItem -Path release -Recurse -File | ForEach-Object {
            $sizeKb = [math]::Round($_.Length / 1KB, 1)
            Write-Host "- $($_.FullName -replace [regex]::Escape((Get-Location).Path + '\'),'') ($sizeKb KB)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
          Get-ChildItem -Path release -Recurse -File | Format-Table Name, Length, FullName

      - name: 📤 Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARAY-Setup-${{ github.ref_name || inputs.tag }}
          path: |
            release/ARAY-Setup-*.exe
            release/ARAY-Portable-*.exe
            release/ARAY-*.zip
            release/latest.yml
          retention-days: 90
          if-no-files-found: warn

      - name: 🏷️ Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ARAY ${{ github.ref_name }}
          body: |
            # ARAY ${{ github.ref_name }}

            **Are you Ready? and....Yapping!**

            ## 📥 Download

            3 formats available — **try ZIP first** (most reliable):

            1. **ARAY-Setup-1.0.0.zip** — extract folder, run ARAY.exe directly
               (no self-extraction, no installer — most reliable)
            2. **ARAY-Setup-1.0.0.exe** — NSIS installer (recommended for permanent install)
            3. **ARAY-Portable-1.0.0.exe** — self-extracting portable (smallest, but
               may be blocked by some antivirus)

            ## 🩺 App won't open? Read this!

            If you downloaded ARAY, double-clicked it, and NOTHING happened
            (no window, no error) — this is almost certainly because
            **Visual C++ Redistributable is missing** from your Windows.

            Electron apps require Microsoft Visual C++ 2015-2022 Runtime.
            Without it, ARAY.exe starts, fails to load VCRUNTIME140.dll,
            and exits silently with no error message.

            ### How to fix (2 options):

            **Option A — Automatic (recommended):**
            1. Download ZIP version and extract it
            2. Double-click `install-vc-runtime.bat` inside the folder
            3. Follow the prompts — it will download and install VC++ Runtime
            4. After install completes, run `ARAY.exe`

            **Option B — Manual:**
            1. Download VC++ Redistributable from Microsoft:
               https://aka.ms/vs/17/release/vc_redist.x64.exe
            2. Run the downloaded `vc_redist.x64.exe`
            3. After install, run `ARAY.exe`

            ### Still not working?

            Run `run-aray-diagnostic.bat` (included in the ZIP/extracted folder).
            It will:
            - Check if VC++ Runtime is installed
            - Run ARAY.exe and capture the exit code
            - Show you EXACTLY what's wrong

            Screenshot the diagnostic output and send it to us.

            ## ⚠️ Windows SmartScreen warning

            Windows SmartScreen may block unsigned apps. To run ARAY:

            1. Right-click the downloaded `.exe` → **Properties**
            2. Check **Unblock** at the bottom → **Apply**
            3. Double-click to run
            4. If SmartScreen appears: **More info** → **Run anyway**

            ## ✅ Verified

            - ✅ TypeScript typecheck passes
            - ✅ electron-vite build produces main + preload + renderer bundles
            - ✅ 45/45 smoke tests pass
            - ✅ NSIS installer packaged

            ## 📦 What's Inside

            - Electron 31 desktop app
            - React 18 + TypeScript + Vite + Tailwind
            - SQLite database (better-sqlite3)
            - Sharp image processing
            - Local-first storage architecture
            - Camera abstraction (WebcamProvider)
            - Brand design system (Purple Haze × Gold × Silver)

            ## 📚 Documentation

            See [README](https://github.com/${{ github.repository }}/blob/main/README.md) and the `docs/` folder.

            ---

            *Yap. Snap. Repeat.*
          files: |
            release/ARAY-Setup-*.exe
            release/ARAY-Portable-*.exe
            release/ARAY-*.zip
            release/latest.yml
          draft: false
          prerelease: false
