name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.6.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: 🚀 Build Windows Installer & Release
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Typecheck
        run: npm run typecheck

      - name: 🏗️ Build (renderer + main + preload)
        run: npm run build

      - name: 🧪 Smoke test
        run: node scripts/smoke-test.mjs

      - name: 📦 Build Windows installer (NSIS + Portable + ZIP)
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📊 List release artifacts
        shell: pwsh
        run: |
          Write-Host "=== Build Artifacts ==="
          Get-ChildItem -Path release -File | ForEach-Object {
            $sizeMB = [math]::Round($_.Length / 1MB, 2)
            Write-Host "  $($_.Name) - $sizeMB MB"
          }

      - name: 🏷️ Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ARAY ${{ github.ref_name }}
          body: |
            # ARAY ${{ github.ref_name }}

            **Are you Ready? and....Yapping!**

            ## 📥 Download

            - **ARAY-Setup-${{ github.ref_name }}.exe** — NSIS installer (recommended)
            - **ARAY-Portable-${{ github.ref_name }}.exe** — portable, no install needed
            - **ARAY-Setup-${{ github.ref_name }}.zip** — ZIP archive (most reliable)

            ## ✅ Verified

            - ✅ TypeScript typecheck passes
            - ✅ esbuild bundles main process (all deps inlined)
            - ✅ Vite builds renderer
            - ✅ Smoke test passes
            - ✅ No native modules (better-sqlite3 + sharp removed)
            - ✅ asar: true (safe — no native modules)

            ## 🏗️ Architecture (v1.6.0+)

            Adapted from Saatiril-Fullset approach:
            - main process bundled with esbuild (inline all deps)
            - preload compiled with tsc
            - renderer built with Vite
            - NO node_modules in package (all inlined)
            - asar: true (smaller, faster, safer)

            ---

            *Yap. Snap. Repeat.*
          files: |
            release/ARAY-Setup-*.exe
            release/ARAY-Portable-*.exe
            release/ARAY-*.zip
            release/latest.yml
          draft: false
          prerelease: false
