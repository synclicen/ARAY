name: 🐛 Bug Report
description: Report something that's broken
title: '[BUG] '
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug! Please fill out the sections below.
        Before submitting, search existing issues to avoid duplicates.

  - type: input
    id: summary
    attributes:
      label: Bug summary
      description: One-sentence description of the problem
      placeholder: 'Camera preview freezes after switching events'
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Detailed steps to trigger the bug
      placeholder: |
        1. Open ARAY
        2. Click 'Booth'
        3. Start capture
        4. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened
    validations:
      required: true

  - type: dropdown
    id: phase
    attributes:
      label: ARAY Phase
      options:
        - Phase 1 — Core (current)
        - Phase 2 — Photo Booth
        - Phase 3 — Google Drive
        - Phase 4 — Media
        - Phase 5 — Advanced
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: ARAY version
      placeholder: '1.0.0'
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: 'Windows 11 22H2'
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / error output
      description: Paste any error messages or relevant log output
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, drag screenshots here

  - type: checkboxes
    id: terms
    attributes:
      label: Confirmation
      options:
        - label: I have searched existing issues and confirmed this is not a duplicate
          required: true
        - label: I have run `npm run typecheck` and `node scripts/smoke-test.mjs` locally
          required: true
