version: 2
updates:
  # npm dependencies — weekly check
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'npm'
    commit-message:
      prefix: 'chore(deps)'
      include: 'scope'
    groups:
      # Group patch updates together to reduce PR noise
      patch:
        update-types:
          - 'patch'
      minor:
        update-types:
          - 'minor'
    # Security-critical packages — never auto-merge, always review
    ignore:
      - dependency-name: 'electron'
        update-types:
          - 'major'
      - dependency-name: 'better-sqlite3'
        update-types:
          - 'major'
      - dependency-name: 'sharp'
        update-types:
          - 'major'

  # GitHub Actions — weekly check
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    labels:
      - 'dependencies'
      - 'github-actions'
    commit-message:
      prefix: 'chore(ci)'
      include: 'scope'
