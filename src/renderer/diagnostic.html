<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ARAY Diagnostic</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Segoe UI', system-ui, sans-serif;
        background: #0F0B1A;
        color: #EDEDF1;
        padding: 40px;
        min-height: 100vh;
      }
      h1 { color: #D4AF37; margin-bottom: 8px; font-size: 28px; }
      .tagline { color: #909099; margin-bottom: 30px; font-style: italic; }
      .check {
        padding: 12px 16px;
        margin-bottom: 8px;
        border-radius: 8px;
        background: #1A1330;
        border: 1px solid #38383C;
        font-family: 'Consolas', monospace;
        font-size: 13px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .ok { border-color: #5FCF80; }
      .ok .icon { color: #5FCF80; }
      .fail { border-color: #E45A5A; }
      .fail .icon { color: #E45A5A; }
      .icon { font-size: 18px; font-weight: bold; }
      .label { flex: 1; }
      .detail { color: #909099; font-size: 11px; }
      .error-box {
        margin-top: 20px;
        padding: 16px;
        background: #2A1515;
        border: 1px solid #E45A5A;
        border-radius: 8px;
        font-family: monospace;
        font-size: 12px;
        white-space: pre-wrap;
        color: #FFB0B0;
        max-height: 300px;
        overflow-y: auto;
      }
      button {
        margin-top: 20px;
        padding: 12px 24px;
        background: linear-gradient(135deg, #7B61A8, #654E8E);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover { background: linear-gradient(135deg, #9B6FC8, #7B61A8); }
    </style>
  </head>
  <body>
    <h1>ARAY Diagnostic Mode</h1>
    <p class="tagline">Are you Ready? and....Yapping! — checking system...</p>
    <div id="checks"></div>
    <div id="errorBox" class="error-box" style="display:none"></div>
    <button id="proceed" onclick="proceed()" style="display:none">Continue to ARAY</button>
    <script>
      const { ipcRenderer } = require('electron');
      const checksDiv = document.getElementById('checks');
      const errorBox = document.getElementById('errorBox');
      const proceedBtn = document.getElementById('proceed');

      function addCheck(name, ok, detail) {
        const div = document.createElement('div');
        div.className = 'check ' + (ok ? 'ok' : 'fail');
        div.innerHTML = '<span class="icon">' + (ok ? '✓' : '✗') + '</span>' +
          '<span class="label">' + name + '</span>' +
          (detail ? '<span class="detail">' + detail + '</span>' : '');
        checksDiv.appendChild(div);
      }

      function showError(msg) {
        errorBox.textContent = msg;
        errorBox.style.display = 'block';
      }

      ipcRenderer.on('diag:check', (_e, data) => {
        addCheck(data.name, data.ok, data.detail || '');
      });

      ipcRenderer.on('diag:error', (_e, data) => {
        showError(data.message + '\n\nStack:\n' + data.stack);
      });

      ipcRenderer.on('diag:done', (_e, allOk) => {
        if (allOk) {
          proceedBtn.style.display = 'block';
        }
      });

      function proceed() {
        ipcRenderer.send('diag:proceed');
      }
    </script>
  </body>
</html>
