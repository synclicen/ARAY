appId: "com.aray.booth"
productName: "ARAY"
copyright: "Copyright © 2026 ARAY"

directories:
  output: release
  buildResources: resources

# Disable asar — better-sqlite3 ships .node native binaries that
# cannot be loaded from inside an asar archive on Windows.
asar: false

# CRITICAL: Do NOT let electron-builder rebuild native modules during packaging.
# It tries to compile from source, which fails on CI runners without Visual Studio.
# better-sqlite3 v11.10.0 ships prebuilt binaries for Electron 31 — those work as-is.
# We use @electron/rebuild with --force --prebuild in a separate CI step instead.
npmRebuild: false

files:
  - out/**/*
  - package.json
  - node_modules/**/*
  - "!node_modules/**/{*.md,*.markdown,LICENSE,CHANGELOG*,*.ts,*.tsx,*.map,test*,tests*,__tests__,docs,example*,*.yml,*.yaml,.github,.vscode,.idea,coverage*,.nyc_output}"
  - "!node_modules/**/{jest.config*,webpack.config*,rollup.config*,tsconfig*,babel.config*,.babelrc,.eslintrc*,.prettierrc*,.npmignore,.gitignore}"

extraResources:
  - from: resources/
    to: resources/

# Include diagnostic BAT files in app root (visible to user after install/extract)
extraFiles:
  - from: resources/run-aray-diagnostic.bat
    to: run-aray-diagnostic.bat
  - from: resources/install-vc-runtime.bat
    to: install-vc-runtime.bat

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
    - target: zip
      arch:
        - x64
  icon: resources/icon/icon.ico
  artifactName: "ARAY-Setup-${version}.${ext}"

portable:
  artifactName: "ARAY-Portable-${version}.${ext}"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: resources/icon/icon.ico
  uninstallerIcon: resources/icon/icon.ico
  shortcutName: ARAY
  artifactName: "ARAY-Setup-${version}.${ext}"
  deleteAppDataOnUninstall: false

publish:
  provider: generic
  url: https://example.com/aray/releases/
  channel: latest
