appId: "com.aray.booth"
productName: "ARAY"
copyright: "Copyright © 2026 ARAY"

directories:
  output: release
  buildResources: resources

files:
  - out/**/*
  - package.json

# Native modules must be unpacked from asar — they cannot be loaded from inside
# the archive. This is critical for portable target which extracts to temp dir.
asarUnpack:
  - "**/*.{node,dll}"
  - "**/better-sqlite3/**"
  - "**/sharp/**"
  - "**/sharp-win32-x64/**"
  - "**/@img/**"
  - "**/node_modules/@img/**"

extraResources:
  - from: resources/
    to: resources/

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: resources/icon/icon.ico
  artifactName: "ARAY-Setup-${version}.${ext}"

portable:
  artifactName: "ARAY-Portable-${version}.${ext}"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: resources/icon/icon.ico
  uninstallerIcon: resources/icon/icon.ico
  shortcutName: ARAY
  artifactName: "ARAY-Setup-${version}.${ext}"
  deleteAppDataOnUninstall: false

publish:
  provider: generic
  url: https://example.com/aray/releases/
  channel: latest
